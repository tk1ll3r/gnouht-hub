<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#15171a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e3e6eb;border-radius:12px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 4px;font-size:16px;font-weight:600">Welcome to gnouht hub</p>
          <p style="margin:0 0 20px;font-size:14px;color:#666b75">You were invited to gnouht hub. Click the button to finish signing in. The link works once and expires in one hour.</p>
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/today"
             style="display:inline-block;background:#2458e6;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:10px 16px;border-radius:8px">Sign in</a>
          <p style="margin:20px 0 0;font-size:12px;color:#666b75">If you did not request this, you can ignore this email — nobody can sign in without the link.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
